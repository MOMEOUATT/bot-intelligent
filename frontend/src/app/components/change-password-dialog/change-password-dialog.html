<div class="dialog-container">
    <div class="dialog-header">
        <mat-icon class="lock-icon">lock_reset</mat-icon>
        <h2>Changer le mot de passe</h2>
        <p class="subtitle">Assurez-vous d'utiliser un mot de passe sécurisé</p>
    </div>

    <div class="dialog-content">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe actuel</mat-label>
            <input 
                matInput 
                [type]="hideOld ? 'password' : 'text'"
                [(ngModel)]="oldPassword"
                placeholder="Entrez votre mot de passe actuel"
                required>
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button" (click)="hideOld = !hideOld">
                <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
        </mat-form-field>

        <div class="divider"></div>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nouveau mot de passe</mat-label>
            <input 
                matInput 
                [type]="hideNew ? 'password' : 'text'"
                [(ngModel)]="newPassword"
                placeholder="Minimum 6 caractères"
                required
                minlength="6">
            <mat-icon matPrefix>vpn_key</mat-icon>
            <button mat-icon-button matSuffix type="button" (click)="hideNew = !hideNew">
                <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-hint align="end">{{ newPassword.length }}/∞</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirmer le mot de passe</mat-label>
            <input 
                matInput 
                [type]="hideConfirm ? 'password' : 'text'"
                [(ngModel)]="confirmPassword"
                placeholder="Retapez le nouveau mot de passe"
                required>
            <mat-icon matPrefix>check_circle</mat-icon>
            <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm">
                <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
        </mat-form-field>

        <div class="error-box" *ngIf="showError">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMessage }}</span>
        </div>

        <div class="strength-indicator" *ngIf="newPassword.length > 0">
            <div class="strength-bar">
                <div class="strength-fill" [class]="getStrengthClass()"></div>
            </div>
            <span class="strength-text">{{ getStrengthText() }}</span>
        </div>
    </div>

    <div class="dialog-actions">
        <button mat-button class="cancel-btn" (click)="onCancel()">
            Annuler
        </button>
        <button 
            mat-raised-button 
            class="confirm-btn"
            (click)="onConfirm()"
            [disabled]="!isValid()">
            <mat-icon>save</mat-icon>
            Changer le mot de passe
        </button>
    </div>
</div>
