<div class="robot-wrapper" [class]="size">
      <svg [attr.width]="dims[size]" [attr.height]="dims[size]" 
           viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- Antenne -->
        <line x1="20" y1="2" x2="20" y2="8" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="2" r="2" fill="#c4b5fd" class="antenna-dot"/>

        <!-- Tête -->
        <rect x="8" y="8" width="24" height="18" rx="6" fill="url(#headGrad)" stroke="#a78bfa" stroke-width="1.5"/>

        <!-- Yeux gauche -->
        <circle cx="15" cy="17" r="3" fill="#0c0e14"/>
        <circle cx="15" cy="17" r="1.5" fill="#a78bfa" class="eye"/>

        <!-- Yeux droit -->
        <circle cx="25" cy="17" r="3" fill="#0c0e14"/>
        <circle cx="25" cy="17" r="1.5" fill="#a78bfa" class="eye eye-delay"/>

        <!-- Corps -->
        <rect x="11" y="27" width="18" height="10" rx="4" fill="url(#bodyGrad)" stroke="#a78bfa" stroke-width="1.5"/>
        <circle cx="20" cy="32" r="2" fill="#7c3aed" class="body-btn"/>

        <!-- Bras -->
        <rect x="4"  y="28" width="6" height="3" rx="1.5" fill="#7c3aed" opacity="0.7"/>
        <rect x="30" y="28" width="6" height="3" rx="1.5" fill="#7c3aed" opacity="0.7"/>

        <defs>
          <linearGradient id="headGrad" x1="8" y1="8" x2="32" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#2e1065"/>
          </linearGradient>
          <linearGradient id="bodyGrad" x1="11" y1="27" x2="29" y2="37" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#2e1065"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
