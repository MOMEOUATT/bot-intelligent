<header class="header">

  <!-- Gauche : Nom utilisateur -->
  <div class="header-left">
    <div class="user-chip">
      <div class="user-avatar">{{ getUserInitials() }}</div>
      <span class="user-name">{{ currentUser?.username }}</span>
    </div>
  </div>

  <!-- Centre : Logo -->
  <div class="header-center">
    <app-waveform-logo size="medium"></app-waveform-logo>
    <span class="brand-name">Lumin</span>
  </div>

  <!-- Droite : Menu -->
  <div class="header-right">
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="menu-trigger">
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="menu-user-info" mat-menu-item disabled>
        <mat-icon>account_circle</mat-icon>
        <span>{{ currentUser?.email }}</span>
      </div>
      <mat-divider></mat-divider>
      
      <!-- ✅ NOUVEAU : Lien vers le profil -->
      <button mat-menu-item (click)="onProfile()">
        <mat-icon>person</mat-icon>
        <span>Mon profil</span>
      </button>
      
      <button mat-menu-item disabled>
        <mat-icon>settings</mat-icon>
        <span>Paramètres</span>
      </button>
      
      <mat-divider></mat-divider>
      
      <button mat-menu-item (click)="onLogout()" class="logout-item">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </mat-menu>
  </div>

</header>
