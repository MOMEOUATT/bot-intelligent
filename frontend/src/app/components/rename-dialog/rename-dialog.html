<div class="dialog-container">
    <div class="dialog-header">
        <mat-icon class="edit-icon">edit_note</mat-icon>
        <h2>Renommer la conversation</h2>
        <p class="subtitle">Donnez un nom significatif à votre conversation</p>
    </div>

    <div class="dialog-content">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Titre de la conversation</mat-label>
            <input 
                matInput 
                [(ngModel)]="newTitle"
                (keyup.enter)="onConfirm()"
                placeholder="Entrez un nouveau titre"
                maxlength="100"
                autofocus>
            <mat-icon matPrefix>title</mat-icon>
            <mat-hint align="end">{{ newTitle.length }}/100</mat-hint>
        </mat-form-field>

        <div class="error-box" *ngIf="showError">
            <mat-icon>error_outline</mat-icon>
            <span>Le titre doit contenir entre 3 et 100 caractères</span>
        </div>

        <div class="info-box">
            <mat-icon>info_outline</mat-icon>
            <span>Le titre sera visible dans la sidebar</span>
        </div>
    </div>

    <div class="dialog-actions">
        <button mat-button class="cancel-btn" (click)="onCancel()">
            Annuler
        </button>
        <button 
            mat-raised-button 
            class="confirm-btn"
            (click)="onConfirm()"
            [disabled]="!isValid()">
            <mat-icon>check</mat-icon>
            Renommer
        </button>
    </div>
</div>
